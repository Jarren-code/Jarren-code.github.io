<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarren's home page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      text-align: center;
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #222;
      margin-bottom: 1.5rem;
      transition: transform 0.3s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      color: #888;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      color: #f5f5f5;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .links a:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    footer {
      margin-top: 3rem;
      color: #444;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="image.png" alt="Jarren" class="avatar">
    <h1>Jarren</h1>
    <p class="tagline">CS 3rd Year @ AI Stream · Finance Minor</p>

    <div class="links">
      <a href="https://github.com/Jarren-code" target="_blank">GitHub</a>
      <a href="mailto:124040023@link.cuhk.edu.cn">Email</a>
      <a href="https://linkedin.com/in/jarren-rowe-himawan/" target="_blank">LinkedIn</a>
    </div>

    <footer>© 2026 Jarren</footer>
  </div>
</body>
</html>
